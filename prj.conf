# 传感器：SENSOR / BMI08X 已在板级 defconfig 默认打开，这里只开需要的 stream 模式
CONFIG_BMI08X_ACCEL_STREAM=y
CONFIG_BMI08X_GYRO_STREAM=y
# 启用遥控器驱动
# CONFIG_REMOTE=y
CONFIG_UART_ASYNC_API=y
CONFIG_DCACHE=n
# 电机
# 当前编译的源文件里没有用到 CAN / 电机驱动（DeviceLayer 的 motor 源码未加入
# target_sources），需要时再打开
# CONFIG_CAN=y
# CONFIG_BLDCM=y
# DJI 电机 CAN 通常为 1Mbps；
# CONFIG_CAN_DEFAULT_BITRATE=1000000
# CONFIG_CAN_RX_MANAGER=y
# CONFIG_CAN_TX_MANAGER=y
# CONFIG_CAN_RX_MANAGER_MSGQ_MONITOR=y
# 丢帧告警限流：累计每丢 100 帧才打一条，避免刷屏冲掉其它日志（默认 1 太吵）
# CONFIG_CAN_RX_MANAGER_MSGQ_WARN_EVERY_N_DROPS=100
# 线程优先级（数值越小越高，0~14）
# 闭环时序：RX(反馈解析) → Update(计算) → System(打包) → TX(发送)，故 RX 高于 TX
# CONFIG_CAN_RX_MANAGER_RX_THREAD_PRIO=3
# CONFIG_CAN_TX_MANAGER_THREAD_PRIORITY=4
# DJI 心跳自动检测（shared system workqueue）
# CONFIG_BLDCM_HEARTBEAT_AUTOCHECK=y
# CONFIG_BLDCM_HEARTBEAT_POLL_PERIOD_MS=100
# 看门狗（IWDG_STM32 驱动默认就开）
CONFIG_WATCHDOG=y

# 启用日志：模式用默认的 DEFERRED（改回 IMMEDIATE 的话各线程栈要重新评估，见 conf_task.hpp）
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# 延迟模式环形缓冲默认只有 1KB，装不下线程分析器那一屏报告（超了直接丢）
CONFIG_LOG_BUFFER_SIZE=8192
# 每条日志立刻唤醒 log 线程输出，而不是等 1000ms 或攒够 10 条
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
# 启用CMSIS-DSP库
CONFIG_CMSIS_DSP=y
# 启用 robotpilots 算法库（algo/），矩阵/KF/EKF 走 CMSIS-DSP 加速
CONFIG_ALGO=y
CONFIG_ALGO_ENABLE_ARM_MATH=y
# 启用 ramenx（ramen 消息/数据流库扩展，ramenx/），ramen 本身要求 C++20
CONFIG_RAMENX=y
# C++ 支持（ramen 使用 concepts/requires，必须 C++20；FPU_SHARING 由 FPU 自动带出）
CONFIG_STD_CPP20=y
CONFIG_FPU=y

# RTT 日志后端
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=5
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=2
# 默认 1KB 上行缓冲写满会丢消息；调大 + 满了覆盖最旧数据，不阻塞也不丢关键信息
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
#用于调试的宏 
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_ASSERT=y
# 线程名：开启后线程分析器才会显示 main/idle/logging 等名字
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
# 分析器线程走 printk，1KB 栈实测已用 984B（96%），被抢占就栈溢出 + MPU FAULT
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=4096
# main线程
CONFIG_MAIN_STACK_SIZE=8192
